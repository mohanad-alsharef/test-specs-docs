<!DOCTYPE html>

</head>

  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>

        {

          name: "CMP API v1"
        },
        {

          name: "LMS API v4"

        {
          url: "dar_v1_openapi.json",
          name: "DAR API v1"

        {
          url: "ils_v1_openapi.json",
          name: "ILS API v1"

      ],
      dom_id: '#swagger-ui',
    });
  </script>
</body>
</html>
